<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07110d">
  <title>Lega</title>
  <link rel="stylesheet" href="assets/style.css?v=20261007-4">
</head>
<body data-page="league">
  <header class="topbar">
    <a href="index.html" class="brand">← Home</a>
    <strong id="header-league"></strong>
  </header>
  <main class="container">
    <section class="hero">
      <h1 id="league-title"></h1>
      <p id="league-season"></p>
    </section>

    <nav class="section-nav">
      <a href="#classifica">Classifica</a>
      <a href="#record-gol">Record gol</a>
      <a href="#statistiche">Marcatori / Assist</a>
      <a href="#calendario">Calendario</a>
      <a href="#archivio">Anni passati</a>
      <a href="#albo">Albo d'Oro</a>
    </nav>

    <section id="classifica" class="panel">
      <h2>Classifica generale</h2>
      <div class="table-wrap"><table id="standings-table"></table></div>
    </section>

    <section id="record-gol" class="panel record-panel">
      <h2>🔥 Record gol in una partita</h2>
      <div id="scoring-record"></div>
    </section>

    <section id="statistiche" class="two-cols league-rankings">
      <section class="panel">
        <h2>⚽ Classifica marcatori della lega</h2>
        <div id="league-scorers"></div>
      </section>
      <section class="panel">
        <h2>🎯 Classifica assistman della lega</h2>
        <div id="league-assists"></div>
      </section>
    </section>

    <section id="calendario" class="panel">
      <h2>Calendario e risultati</h2>
      <div id="calendar"></div>
    </section>

    <section id="archivio" class="panel">
      <h2>Anni passati</h2>
      <div id="archive" class="cards"></div>
    </section>

    <section id="albo" class="panel">
      <h2>🏆 Albo d'Oro</h2>
      <div id="champions-history" class="cards"></div>
      <h3>🏅 Palmarès storico</h3>
      <div id="palmares"></div>
    </section>
  </main>
  <script src="assets/app.js?v=20261007-4"></script>
</body>
</html>
